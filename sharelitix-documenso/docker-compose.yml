version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sharelitix-documenso_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    # Tiny redirect to the Documenso stack (Portainer, port 18090) on the same box.
    # nginx's $host has no port, so this works for local names, Tailscale names and IPs.
    command:
      - /bin/sh
      - -c
      - |
        echo 'server { listen 80; location / { return 302 http://$$host:18090$$request_uri; } }' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
